<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" aria-labelledby="sequence-title sequence-desc">
<title id="sequence-title">Sequence - close menunggu receipt berhasil</title><desc id="sequence-desc">SINTETIS. Pesan konseptual WEB/Gateway, service, DB dan audit, simulator, dan notification stub. Gagal kirim tidak boleh menghasilkan closed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#607780"/></marker></defs>
<rect width="1240" height="590" rx="16" fill="white"/>
<g font-family="Arial, sans-serif"><text x="40" y="38" fill="#142d3a" font-size="23" font-weight="700">Sequence - close menunggu receipt berhasil</text>
<g transform="translate(20,65)"><polyline points="115,85 115,460" fill="none" stroke="#607780" stroke-width="2" stroke-dasharray="7 6"/>
<polyline points="355,85 355,460" fill="none" stroke="#607780" stroke-width="2" stroke-dasharray="7 6"/>
<polyline points="595,85 595,460" fill="none" stroke="#607780" stroke-width="2" stroke-dasharray="7 6"/>
<polyline points="835,85 835,460" fill="none" stroke="#607780" stroke-width="2" stroke-dasharray="7 6"/>
<polyline points="1080,85 1080,460" fill="none" stroke="#607780" stroke-width="2" stroke-dasharray="7 6"/>
<polyline points="115,125 355,125" fill="none" stroke="#607780" stroke-width="2" marker-end="url(#arrow)"/><rect x="172.45" y="98" width="125.1" height="22" rx="4" fill="white"/><text x="235" y="114" text-anchor="middle" fill="#435e68" font-size="16">1. Buat kasus</text>
<polyline points="355,170 595,170" fill="none" stroke="#607780" stroke-width="2" marker-end="url(#arrow)"/><rect x="395.05" y="143" width="159.89999999999998" height="22" rx="4" fill="white"/><text x="475" y="159" text-anchor="middle" fill="#435e68" font-size="16">2. Simpan + audit</text>
<polyline points="355,220 835,220" fill="none" stroke="#607780" stroke-width="2" marker-end="url(#arrow)"/><rect x="503.95" y="193" width="212.1" height="22" rx="4" fill="white"/><text x="610" y="209" text-anchor="middle" fill="#435e68" font-size="16">3. GET status read-only</text>
<polyline points="355,275 1080,275" fill="none" stroke="#607780" stroke-width="2" marker-end="url(#arrow)"/><rect x="594.8" y="248" width="290.4" height="22" rx="4" fill="white"/><text x="740" y="264" text-anchor="middle" fill="#435e68" font-size="16">4. Setelah resolved: kirim hasil</text>
