<polyline points="1080,390 355,390" fill="none" stroke="#607780" stroke-width="2" marker-end="url(#arrow)"/><rect x="535.65" y="363" width="368.7" height="22" rx="4" fill="white"/><text x="720" y="379" text-anchor="middle" fill="#435e68" font-size="16">6. Setelah retry berhasil: receipt sukses</text>
<polyline points="355,445 595,445" fill="none" stroke="#607780" stroke-width="2" marker-end="url(#arrow)"/><rect x="399.4" y="418" width="151.2" height="22" rx="4" fill="white"/><text x="475" y="434" text-anchor="middle" fill="#435e68" font-size="16">7. Close + audit</text><rect x="15" y="15" width="200" height="70" rx="12" fill="#142d3a" stroke="#142d3a"/><text fill="#ffffff" text-anchor="middle" font-size="19" font-weight="600"><tspan x="115" y="56">CS / WEB / Gateway</tspan></text>
<rect x="255" y="15" width="200" height="70" rx="12" fill="#126b60" stroke="#126b60"/><text fill="#ffffff" text-anchor="middle" font-size="19" font-weight="600"><tspan x="355" y="56">Complaint Service</tspan></text>
<rect x="495" y="15" width="200" height="70" rx="12" fill="#e6f3e9" stroke="#c6d6d5"/><text fill="#203c47" text-anchor="middle" font-size="19" font-weight="600"><tspan x="595" y="56">DB + Audit Store</tspan></text>
<rect x="735" y="15" width="200" height="70" rx="12" fill="#fff0d6" stroke="#c6d6d5"/><text fill="#203c47" text-anchor="middle" font-size="19" font-weight="600"><tspan x="835" y="56">Core Simulator</tspan></text>
<rect x="975" y="15" width="210" height="70" rx="12" fill="#e6f3e9" stroke="#c6d6d5"/><text fill="#203c47" text-anchor="middle" font-size="19" font-weight="600"><tspan x="1080" y="56">Notification Stub</tspan></text></g>
